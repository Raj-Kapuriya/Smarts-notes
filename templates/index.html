<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Notes – AI-Powered Academic Assistant</title>
<meta name="description" content="Sign in or create your Smart Notes account to access your AI-powered PDF library and academic assistant."/>
<meta name="robots" content="index, follow"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"/>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "outline-variant": "#444653",
          "on-surface-variant": "#c5c5d5",
          "surface-container-highest": "#333345",
          "on-surface": "#e3e0f8",
          "surface-variant": "#333345",
          "secondary": "#bcc7dd",
          "primary": "#b9c3ff",
          "on-background": "#e3e0f8",
          "secondary-container": "#3c475a",
          "on-primary": "#002388",
          "primary-container": "#7189f6",
          "tertiary-container": "#a17cec",
          "error": "#ffb4ab",
          "outline": "#8f909e",
          "on-tertiary": "#3d0e84",
          "tertiary": "#d2bbff",
          "surface-container": "#1e1e2f",
          "surface": "#121222",
          "surface-container-low": "#1a1a2b",
          "background": "#121222",
        },
        fontFamily: {
          "headline": ["Manrope"],
          "body": ["Inter"],
        }
      },
    },
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    display: inline-block; vertical-align: middle;
  }
  .glass-panel {
    background: rgba(30, 30, 47, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  .bg-mesh {
    background:
      radial-gradient(at 0% 0%,   #0c0c1d 0px, transparent 50%),
      radial-gradient(at 100% 0%, #1e1e2f 0px, transparent 50%),
      radial-gradient(at 100% 100%, #3d0e84 0px, transparent 50%),
      radial-gradient(at 0% 100%, #121222 0px, transparent 50%);
    background-color: #0c0c1d;
  }
  .input-field {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-color 0.2s, background 0.2s;
  }
  .input-field:focus {
    border-color: #7189f6;
    background: rgba(113,137,246,0.08);
    outline: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #7189f6 0%, #a17cec 100%);
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .tab-btn { transition: all 0.2s; }
  .tab-btn.active {
    color: #b9c3ff;
    border-bottom: 2px solid #7189f6;
  }
  .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
  .toast { padding: 0.75rem 1.25rem; border-radius: 0.75rem; font-size: 0.85rem; font-weight: 500; animation: slideIn 0.3s ease; }
  .toast.success { background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
  .toast.error   { background: rgba(239,68,68,0.2);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body class="bg-mesh min-h-screen flex flex-col font-body text-on-surface overflow-x-hidden">

<!-- Navbar -->
<nav class="fixed top-0 w-full flex justify-between items-center px-8 py-5 z-50 bg-transparent font-headline">
  <a href="/" class="text-2xl font-bold tracking-tight text-primary flex items-center gap-2 no-underline">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">auto_stories</span>
    Smart Notes
  </a>
</nav>

<!-- Main -->
<main class="flex-grow flex items-center justify-center px-4 py-28">
  <div class="w-full max-w-[420px] glass-panel rounded-3xl p-8 shadow-[0_20px_60px_rgba(0,0,0,0.6)] flex flex-col gap-6 border border-white/5">

    <!-- Logo mark -->
    <div class="flex flex-col items-center gap-2">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#7189f6] to-[#a17cec] flex items-center justify-center shadow-lg">
        <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1;">auto_stories</span>
      </div>
      <h1 class="text-2xl font-headline font-bold text-on-surface tracking-tight">Smart Notes</h1>
      <p class="text-sm text-on-surface-variant text-center">Your AI-powered academic assistant</p>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-white/10" id="auth-tabs">
      <button class="tab-btn active flex-1 py-2 text-sm font-semibold text-on-surface-variant" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn flex-1 py-2 text-sm font-semibold text-on-surface-variant" id="tab-register" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Login form -->
    <form id="login-form" class="flex flex-col gap-4" onsubmit="handleLogin(event)">
      <div>
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1 block">Email</label>
        <input id="login-email" type="email" placeholder="you@example.com" required
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-on-surface placeholder-outline"/>
      </div>
      <div class="relative">
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1 block">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" required
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-on-surface placeholder-outline pr-12"/>
        <button type="button" onclick="togglePwd('login-password', this)"
          class="absolute right-3 bottom-3 text-outline hover:text-on-surface-variant">
          <span class="material-symbols-outlined text-lg">visibility</span>
        </button>
      </div>
      <button type="submit" id="login-btn"
        class="btn-primary w-full py-3 rounded-xl font-headline font-bold text-white text-sm tracking-wide flex items-center justify-center gap-2 mt-1">
        <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1;">login</span>
        Sign In
      </button>
    </form>

    <!-- Register form -->
    <form id="register-form" class="flex flex-col gap-4 hidden" onsubmit="handleRegister(event)">
      <div>
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1 block">Email</label>
        <input id="reg-email" type="email" placeholder="you@example.com" required
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-on-surface placeholder-outline"/>
      </div>
      <div class="relative">
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1 block">Password</label>
        <input id="reg-password" type="password" placeholder="Min 8 characters" required minlength="8"
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-on-surface placeholder-outline pr-12"/>
        <button type="button" onclick="togglePwd('reg-password', this)"
          class="absolute right-3 bottom-3 text-outline hover:text-on-surface-variant">
          <span class="material-symbols-outlined text-lg">visibility</span>
        </button>
      </div>
      <div class="relative">
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1 block">Confirm Password</label>
        <input id="reg-confirm" type="password" placeholder="Re-enter password" required
          class="input-field w-full px-4 py-3 rounded-xl text-sm text-on-surface placeholder-outline pr-12"/>
        <button type="button" onclick="togglePwd('reg-confirm', this)"
          class="absolute right-3 bottom-3 text-outline hover:text-on-surface-variant">
          <span class="material-symbols-outlined text-lg">visibility</span>
        </button>
      </div>
      <button type="submit" id="reg-btn"
        class="btn-primary w-full py-3 rounded-xl font-headline font-bold text-white text-sm tracking-wide flex items-center justify-center gap-2 mt-1">
        <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1;">person_add</span>
        Create Account
      </button>
    </form>

    <!-- Feature pills -->
    <div class="flex flex-wrap gap-2 justify-center pt-2 border-t border-white/5">
      <span class="text-[10px] px-2.5 py-1 rounded-full bg-primary-container/20 text-primary border border-primary/20">📄 PDF Summaries</span>
      <span class="text-[10px] px-2.5 py-1 rounded-full bg-tertiary/10 text-tertiary border border-tertiary/20">🤖 AI Q&amp;A</span>
      <span class="text-[10px] px-2.5 py-1 rounded-full bg-secondary/10 text-secondary border border-secondary/20">🔍 Semantic Search</span>
    </div>

  </div>
</main>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script>
  // ── Auth state ──────────────────────────────────────────────────────────
  if (localStorage.getItem('sn_token')) {
    window.location.href = '/dashboard';
  }

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('login-form').classList.toggle('hidden', !isLogin);
    document.getElementById('register-form').classList.toggle('hidden', isLogin);
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
  }

  function togglePwd(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon  = btn.querySelector('.material-symbols-outlined');
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.textContent = show ? 'visibility_off' : 'visibility';
  }

  function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.style.opacity = loading ? '0.6' : '';
  }

  // ── Login ───────────────────────────────────────────────────────────────
  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    setLoading('login-btn', true);
    try {
      const res  = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Login failed', 'error'); return; }
      localStorage.setItem('sn_token', data.token);
      localStorage.setItem('sn_user',  JSON.stringify(data.user));
      toast('Welcome back! Redirecting…');
      setTimeout(() => window.location.href = '/dashboard', 800);
    } catch {
      toast('Network error – please try again', 'error');
    } finally {
      setLoading('login-btn', false);
    }
  }

  // ── Register ─────────────────────────────────────────────────────────────
  async function handleRegister(e) {
    e.preventDefault();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;
    if (password !== confirm) { toast('Passwords do not match', 'error'); return; }
    setLoading('reg-btn', true);
    try {
      const res  = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Registration failed', 'error'); return; }
      localStorage.setItem('sn_token', data.token);
      localStorage.setItem('sn_user',  JSON.stringify(data.user));
      toast('Account created! Redirecting…');
      setTimeout(() => window.location.href = '/dashboard', 800);
    } catch {
      toast('Network error – please try again', 'error');
    } finally {
      setLoading('reg-btn', false);
    }
  }
</script>
</body>
</html>
